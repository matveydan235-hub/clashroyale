<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Арена королей</title>
<style>
:root{--bg:#f1f5f9;--fg:#0f172a;--pn:#fff;--bd:#cbd5e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#f1f5f9;--pn:#1e293b;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#f1f5f9;--pn:#1e293b;--bd:#334155}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Trebuchet MS,Verdana,sans-serif;display:flex;justify-content:center}
#g{width:100%;max-width:420px;padding:8px;position:relative}
#hud{display:flex;justify-content:space-between;font-weight:700;padding:2px 4px 6px;font-size:15px}
canvas{display:block;margin:0 auto;border-radius:10px;touch-action:none;background:#4ade80}
#eb{height:18px;background:var(--pn);border:1px solid var(--bd);border-radius:9px;margin:8px 0;overflow:hidden;position:relative}
#ef{height:100%;width:50%;background:linear-gradient(90deg,#c026d3,#e879f9);transition:width .1s}
#et{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
#hand{display:grid;grid-template-columns:repeat(4,1fr) 44px;gap:6px;align-items:end}
.cd{position:relative;border:2px solid var(--bd);background:var(--pn);color:var(--fg);border-radius:10px;padding:16px 2px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.cd{min-height:78px;justify-content:center}.cd b{font-size:30px;line-height:1.1}.cd small{font-size:12px;font-weight:700;margin-top:2px}
.cd i{position:absolute;top:-6px;left:-6px;background:#c026d3;color:#fff;font-style:normal;font-weight:700;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:13px}
.cd.sel{border-color:#facc15;transform:translateY(-6px)}.cd.off{opacity:.45}
#nx{font-size:11px;text-align:center}#nx b{display:block;font-size:20px}
#ov{position:absolute;inset:0;background:rgba(15,23,42,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;border-radius:10px;text-align:center}
#ov h2{font-size:34px;margin:0}#ov button{font:inherit;font-weight:700;font-size:18px;padding:10px 26px;border:0;border-radius:10px;background:#facc15;color:#0f172a;cursor:pointer}
#mn{position:absolute;inset:0;z-index:5;background:rgba(15,23,42,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;border-radius:10px;text-align:center;padding:16px}#mn h2{margin:0 0 8px;font-size:30px}#mn button{font:inherit;font-weight:700;font-size:17px;padding:10px 24px;border:0;border-radius:10px;background:#facc15;color:#0f172a;cursor:pointer}#mn input{font:inherit;padding:9px;border-radius:8px;border:0;width:210px;text-align:center}#ta{width:280px;font-size:11px;border-radius:8px;border:0;padding:6px}#st{font-size:13px;min-height:36px;max-width:300px}#ov{z-index:6}#hint{display:none;font-size:12px;opacity:.7;text-align:center;margin-top:6px}
</style></head><body><div id="g">
<div id="hud"><span id="cr">🏆 0 : 0</span><span id="tm">3:00</span></div>
<canvas id="c" width="360" height="600"></canvas>
<div id="eb"><div id="ef"></div><div id="et"></div></div>
<div id="hand"></div>
<div id="hint">Выбери карту, затем коснись своей половины поля (нижней). Огненный шар — в любую точку.</div>
<div id="mn"><h2>👑 Арена королей</h2><button id="bb">Играть с ботом</button>
<input id="code" placeholder="код комнаты, напр. duel7" maxlength="30"><button id="ob">Онлайн-дуэль</button><div style="font-size:13px;opacity:.8">— или без claude.ai, напрямую (P2P) —</div>
<div><button id="mk">Создать игру</button> <button id="jn">Войти по коду</button></div>
<textarea id="ta" rows="4" hidden></textarea><div><button id="go" hidden></button> <button id="cp" hidden>Копировать</button></div>
<div id="st"></div></div>
<div id="ov"><h2 id="rt"></h2><button id="rb">Играть снова</button></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=360,H=600,RY=300;
const T={
knight:{n:'Рыцарь',e:'⚔️',c:3,hp:660,d:75,cd:1.1,s:45,r:14,k:1},
archer:{n:'Лучницы',e:'🏹',c:3,hp:125,d:33,cd:1,s:45,r:90,k:2},
giant:{n:'Гигант',e:'🗿',c:5,hp:1500,d:90,cd:1.5,s:28,r:14,k:1,b:1},
pekka:{n:'Пекка',e:'🤖',c:4,hp:600,d:230,cd:1.6,s:55,r:14,k:1},
gob:{n:'Гоблины',e:'👺',c:2,hp:80,d:50,cd:.9,s:85,r:12,k:3},
musk:{n:'Мушкетёр',e:'🔫',c:4,hp:340,d:100,cd:1.1,s:45,r:100,k:1},
skel:{n:'Скелеты',e:'💀',c:1,hp:32,d:32,cd:1,s:80,r:12,k:4},
bomb:{n:'Бомбер',e:'💣',c:3,hp:150,d:130,cd:1.8,s:45,r:80,k:1},
fire:{n:'Шар',e:'🔥',c:4,spell:1}};
const keys=Object.keys(T);
let U,B,FX,el,ael,time,hand,queue,sel,over,ax,last,mode='bot',rm=null,uid=0,ores=0,flip=false,lastSnap=0,started=0;
const tw=(team,x,y,k)=>({team,x,y,t:1,k,hp:k?2400:1400,mh:k?2400:1400,cd:0});
function init(){
 U=[];FX=[];B=[tw(1,90,130),tw(1,270,130),tw(1,180,60,1),tw(0,90,470),tw(0,270,470),tw(0,180,540,1)];
 el=5;ael=5;time=180;ax=3;sel=-1;over=0;
 queue=keys.slice().sort(()=>Math.random()-.5);hand=queue.splice(0,4);
 document.getElementById('ov').style.display='none';drawHand();
}
function drawHand(){
 const h=document.getElementById('hand');h.innerHTML='';
 hand.forEach((k,i)=>{const b=document.createElement('button');b.className='cd'+(i===sel?' sel':'');
  b.innerHTML=`<i>${T[k].c}</i><b>${T[k].e}</b><small>${T[k].n}</small>`;
  b.onclick=()=>{sel=sel===i?-1:i;drawHand()};h.appendChild(b)});
 const n=document.createElement('div');n.id='nx';n.innerHTML=`след.<b>${T[queue[0]].e}</b>`;h.appendChild(n);
}
function spawn(tm,k,px,py){
 const s=T[k];
 if(s.spell){FX.push({x:px,y:py,life:.4});if(mode==='host'&&rm)rm.emit('fb',{x:px|0,y:py|0});
  for(const o of [...U,...B])if(o.team!==tm&&o.hp>0&&Math.hypot(o.x-px,o.y-py)<55+(o.t?18:0))o.hp-=o.t?170:325;return}
 for(let i=0;i<s.k;i++)U.push({id:++uid,team:tm,k,x:px+(i-(s.k-1)/2)*16,y:py+(i%2)*6,hp:s.hp,mh:s.hp,cd:.3});
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const side=y=>y<RY-14?0:y>RY+14?2:1;
function step(dt){
 el=Math.min(10,el+dt/(time<60?1.4:2.8));ael=Math.min(10,ael+dt/(time<60?1.4:2.8));
 if(mode==='bot')ax-=dt;
 if(mode==='bot'&&ax<=0){ax=1+Math.random()*1.5;const k=keys[Math.random()*keys.length|0],s=T[k];
  if(ael>=s.c&&(ael>=7||Math.random()<.3)){
   if(s.spell){const t=U.filter(u=>u.team===0&&u.hp>0);if(t.length){const u=t[Math.random()*t.length|0];ael-=s.c;spawn(1,k,u.x,u.y)}}
   else{ael-=s.c;spawn(1,k,(Math.random()<.5?90:270)+(Math.random()*40-20),190+Math.random()*60)}}}
 for(const u of U){
  const s=T[u.k];u.cd-=dt;let tg=null,td=85;
  if(!s.b)for(const o of U)if(o.team!==u.team&&o.hp>0){const d=dist(o,u);if(d<td){td=d;tg=o}}
  if(!tg){let bd=1e9;for(const t of B)if(t.team!==u.team&&t.hp>0){const d=dist(t,u);if(d<bd){bd=d;tg=t}}}
  if(!tg)continue;
  const d=dist(tg,u);
  if(d<=s.r+(tg.t?20:8)){
   if(u.cd<=0){tg.hp-=s.d;u.cd=s.cd;FX.push({x1:u.x,y1:u.y,x2:tg.x,y2:tg.y,life:.1,tm:u.team})}
  }else{
   let gx=tg.x,gy=tg.y;const su=side(u.y),st=side(tg.y);
   if(su!==st){const bx=Math.abs(u.x-90)<Math.abs(u.x-270)?90:270;
    if(su===1)gx=bx;else if(Math.abs(u.x-bx)>14){gx=bx;gy=u.y}else{gx=bx;gy=RY}}
   const dd=Math.hypot(gx-u.x,gy-u.y)||1;
   u.x+=(gx-u.x)/dd*s.s*dt;u.y+=(gy-u.y)/dd*s.s*dt;
  }
 }
 for(let i=0;i<U.length;i++)for(let j=i+1;j<U.length;j++){
  const a=U[i],b=U[j],d=dist(a,b);
  if(d<13&&d>0){const p=(13-d)/2/d;a.x+=(a.x-b.x)*p;a.y+=(a.y-b.y)*p;b.x-=(a.x-b.x)*p*.0;b.x+=(b.x-a.x)*p;b.y+=(b.y-a.y)*p}}
 for(const u of U){u.x=Math.max(8,Math.min(W-8,u.x))}
 for(const t of B){
  t.cd-=dt;if(t.hp<=0)continue;let tg=null,td=135;
  for(const o of U)if(o.team!==t.team&&o.hp>0){const d=dist(o,t);if(d<td){td=d;tg=o}}
  if(tg&&t.cd<=0){tg.hp-=t.k?60:50;t.cd=.8;FX.push({x1:t.x,y1:t.y,x2:tg.x,y2:tg.y,life:.1,tm:t.team})}}
 U=U.filter(u=>u.hp>0);
 for(const f of FX)f.life-=dt;FX=FX.filter(f=>f.life>0);
 time-=dt;
 const cr=tm=>{const d=B.filter(t=>t.team===tm&&t.hp<=0);return d.some(t=>t.k)?3:d.length};
 const a=cr(1),b=cr(0);
 document.getElementById('cr').textContent=`🏆 ${a} : ${b}`;
 if(B[2].hp<=0||B[5].hp<=0||time<=0){
  over=1;ores=a>b?1:a<b?2:3;document.getElementById('rt').textContent=a>b?'Победа! 👑':a<b?'Поражение 💀':'Ничья';
  document.getElementById('ov').style.display='flex'}
}
function bar(x,y,w,f,c){X.fillStyle='#0008';X.fillRect(x-w/2,y,w,4);X.fillStyle=c;X.fillRect(x-w/2,y,w*Math.max(0,f),4)}
function tx(t,x,y,dy){X.save();X.translate(x,y);if(flip)X.scale(-1,-1);X.fillText(t,0,dy);X.restore()}
function draw(){
 const my=mode==='guest'?1:0;X.save();if(flip){X.translate(W,H);X.scale(-1,-1)}
 X.fillStyle='#4ade80';X.fillRect(0,0,W,H);X.fillStyle='#3fcf74';flip?X.fillRect(0,0,W,RY):X.fillRect(0,RY,W,H-RY);
 if(sel>=0&&!T[hand[sel]].spell){X.fillStyle='#ffffff30';flip?X.fillRect(0,0,W,RY-14):X.fillRect(0,RY+14,W,H-RY-14)}
 X.fillStyle='#38bdf8';X.fillRect(0,RY-14,W,28);
 X.fillStyle='#a16207';for(const bx of[90,270])X.fillRect(bx-25,RY-16,50,32);
 X.fillStyle='#ffffff40';X.fillRect(0,RY-1,W,2);X.textAlign='center';
 for(const t of B){
  const col=t.team===my?'#3b82f6':'#ef4444';
  if(t.hp<=0){X.font='26px serif';tx('🪨',t.x,t.y,9);continue}
  X.fillStyle=col;X.beginPath();X.arc(t.x,t.y,t.k?24:19,0,7);X.fill();
  X.font=(t.k?30:24)+'px serif';tx(t.k?'👑':'🏰',t.x,t.y,t.k?11:9);
  bar(t.x,t.y+(t.k?28:23),40,t.hp/t.mh,col)}
 for(const u of U){
  X.fillStyle=u.team===my?'#3b82f6':'#ef4444';X.beginPath();X.arc(u.x,u.y,11,0,7);X.fill();
  X.fillStyle='#fff';X.beginPath();X.arc(u.x,u.y,9,0,7);X.fill();
  X.fillStyle='#000';X.font=(u.k==='giant'?'19':'15')+'px serif';tx(T[u.k].e,u.x,u.y,6);
  bar(u.x,u.y+13,20,u.hp/u.mh,'#22c55e')}
 for(const f of FX){
  if(f.x1!==undefined){X.strokeStyle=f.tm===my?'#bfdbfe':'#fca5a5';X.lineWidth=2;X.beginPath();X.moveTo(f.x1,f.y1);X.lineTo(f.x2,f.y2);X.stroke()}
  else{X.fillStyle=`rgba(251,146,60,${f.life*2})`;X.beginPath();X.arc(f.x,f.y,55,0,7);X.fill()}}
 X.restore()}
function ui(){
 document.getElementById('ef').style.width=el*10+'%';
 document.getElementById('et').textContent=Math.floor(el)+' / 10';
 const m=Math.max(0,time)|0;document.getElementById('tm').textContent=(time<60?'⚡ ':'')+(m/60|0)+':'+String(m%60).padStart(2,'0');
 document.querySelectorAll('.cd').forEach((b,i)=>b.classList.toggle('off',el<T[hand[i]].c));
}
C.addEventListener('pointerdown',e=>{
 if(over||sel<0)return;
 const r=C.getBoundingClientRect();let px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*H/r.height;
 if(flip){px=W-px;py=H-py}
 const k=hand[sel],s=T[k];
 if(el<s.c)return;
 if(!s.spell&&(flip?py>RY-20:py<RY+20))return;
 px=Math.max(12,Math.min(W-12,px));py=Math.max(12,Math.min(H-12,py));
 if(mode==='guest')rm.emit('cmd',{k,x:px|0,y:py|0});else spawn(0,k,px,py);
 el-=s.c;queue.push(k);hand[sel]=queue.shift();sel=-1;drawHand();
});
const $=id=>document.getElementById(id);
const crn=tm=>{const d=B.filter(t=>t.team===tm&&t.hp<=0);return d.some(t=>t.k)?3:d.length};
function finish(txt){over=1;$('rt').textContent=txt;$('ov').style.display='flex'}
function snap(){rm.emit('snap',{u:U.map(u=>[u.id,u.team,keys.indexOf(u.k),u.x|0,u.y|0,u.hp|0,u.mh|0]),b:B.map(t=>t.hp|0),e:ael,t:time|0,o:ores})}
function apply(d){
 if(!d||!Array.isArray(d.u)||!Array.isArray(d.b))return;
 const m={};for(const u of U)m[u.id]=u;
 U=d.u.map(a=>{let u=m[a[0]];if(!u)u={id:a[0],team:a[1],k:keys[a[2]],x:a[3],y:a[4]};u.tx=a[3];u.ty=a[4];u.hp=a[5];u.mh=a[6];return u}).filter(u=>T[u.k]);
 d.b.forEach((h,i)=>{if(B[i])B[i].hp=h});el=d.e;time=d.t;
 $('cr').textContent=`🏆 ${crn(0)} : ${crn(1)}`;
 if(d.o&&!over)finish(d.o===2?'Победа! 👑':d.o===1?'Поражение 💀':'Ничья')}
function onCmd(m){
 if(mode!=='host'||m.isMe||over)return;const d=m.data||{};
 if(!keys.includes(d.k)||typeof d.x!=='number'||typeof d.y!=='number')return;
 const s=T[d.k];if(ael<s.c||(!s.spell&&d.y>RY-20))return;
 ael-=s.c;spawn(1,d.k,Math.max(12,Math.min(W-12,d.x)),Math.max(12,Math.min(H-12,d.y)))}
function showMenu(){$('mn').style.display='flex';$('ov').style.display='none'}
function startBot(){if(rm){rm.leave();rm=null}mode='bot';flip=false;started=0;init();$('mn').style.display='none'}
function wire(){
 rm.on('cmd',onCmd);
 rm.on('snap',m=>{if(mode==='guest'&&!m.isMe)apply(m.data)});
 rm.on('fb',m=>{if(mode==='guest'&&!m.isMe&&m.data)FX.push({x:+m.data.x||0,y:+m.data.y||0,life:.4})})}
function begin(host){started=1;mode=host?'host':'guest';flip=!host;init();if(!host){U=[];time=180}$('mn').style.display='none'}
$('bb').onclick=startBot;
/* P2P WebRTC с ручным обменом кодами */
let pc=null,stage='';
const enc=d=>btoa(JSON.stringify(d)),dec=t=>JSON.parse(atob(t.trim()));
const gather=p=>new Promise(r=>{if(p.iceGatheringState==='complete')return r();
 p.addEventListener('icegatheringstatechange',()=>p.iceGatheringState==='complete'&&r());setTimeout(r,5000)});
function mkPc(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 pc.onconnectionstatechange=()=>{if(['failed','disconnected'].includes(pc.connectionState)){if(started&&!over)finish('Соединение потеряно');else if(!started)$('st').textContent='Не удалось соединиться напрямую (сеть блокирует P2P). Попробуйте другую сеть.'}};return pc}
function setup(dc,host){
 const h={};dc.onmessage=e=>{try{const[t,d]=JSON.parse(e.data);h[t]&&h[t]({isMe:false,data:d})}catch(_){}};
 dc.onopen=()=>{rm={emit(t,d){if(dc.readyState==='open')dc.send(JSON.stringify([t,d]));return Promise.resolve()},on(t,f){h[t]=f},presence(){},leave(){try{dc.close();pc.close()}catch(_){}}};wire();begin(host)};
 dc.onclose=()=>{if(started&&!over)finish('Соперник вышел')}}
const showTa=(v,b)=>{$('ta').hidden=false;$('ta').value=v;$('go').hidden=!b;$('go').textContent=b||'';$('cp').hidden=false};
$('cp').onclick=()=>{$('ta').select();try{navigator.clipboard.writeText($('ta').value)}catch(_){document.execCommand('copy')}};
$('mk').onclick=async()=>{
 if(!window.RTCPeerConnection){$('st').textContent='Браузер не поддерживает WebRTC';return}
 stage='host';$('st').textContent='Создаю код…';mkPc();setup(pc.createDataChannel('g'),true);
 await pc.setLocalDescription(await pc.createOffer());await gather(pc);
 showTa(enc(pc.localDescription),'Подключить');
 $('st').textContent='1) Скопируй код и отправь другу. 2) Друг пришлёт ответный код — вставь его вместо этого текста и нажми «Подключить».'};
$('jn').onclick=()=>{
 if(!window.RTCPeerConnection){$('st').textContent='Браузер не поддерживает WebRTC';return}
 stage='join';showTa('','Создать ответ');$('cp').hidden=true;$('ta').placeholder='Вставь код от друга';
 $('st').textContent='Вставь код друга в поле и нажми «Создать ответ».'};
$('go').onclick=async()=>{
 try{
  if(stage==='host'){await pc.setRemoteDescription(dec($('ta').value));$('st').textContent='Соединяюсь…'}
  else if(stage==='join'){mkPc();pc.ondatachannel=e=>setup(e.channel,false);
   await pc.setRemoteDescription(dec($('ta').value));await pc.setLocalDescription(await pc.createAnswer());await gather(pc);
   showTa(enc(pc.localDescription),'');$('st').textContent='Скопируй этот ответ, отправь другу и жди — игра начнётся сама.'}
 }catch(e){$('st').textContent='Неверный код, попробуй ещё раз'}};
$('rb').onclick=()=>{if(rm){rm.leave();rm=null;mode='bot';flip=false;started=0;init();over=1;showMenu()}else init()};
$('ob').onclick=async()=>{
 const st=$('st'),nm=$('code').value.trim().toLowerCase();
 if(!/^[a-z0-9][a-z0-9_.-]{0,47}$/.test(nm)){st.textContent='Код: латиница и цифры, например duel7';return}
 if(!window.claude){st.textContent='Онлайн работает только в опубликованной версии на claude.ai';return}
 st.textContent='Подключаюсь…';
 try{const room=await claude.use('room');
  if(!room){st.textContent='Онлайн недоступен: войди в claude.ai с доступом на редактирование этой страницы';return}
  rm=await room.join(nm)}catch(e){rm=null;st.textContent='Не удалось войти: '+(e.code||e.message);return}
 wire();
 rm.presence({here:1});
 st.textContent='Жду соперника… Код комнаты: '+nm+' — отправь его другу';
 rm.onPeers(ch=>{const p=[...ch.peers].sort((a,b)=>a.peer<b.peer?-1:1).slice(0,2);
  if(!started&&p.length===2&&p.some(x=>x.sameTab)){
   started=1;const host=p[0].sameTab;mode=host?'host':'guest';flip=!host;init();
   if(!host){U=[];time=180}
   $('mn').style.display='none'}
  else if(started&&ch.peers.length<2&&!over)finish('Соперник вышел')})};
function fit(){const ah=innerHeight-215;C.style.width=Math.max(220,Math.min(404,ah*.6))+'px'}
addEventListener('resize',fit);fit();
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(mode==='guest'){const k=Math.min(1,dt*12);for(const u of U){if(u.tx!==undefined){u.x+=(u.tx-u.x)*k;u.y+=(u.ty-u.y)*k}}
  for(const f of FX)f.life-=dt;FX=FX.filter(f=>f.life>0)}
 else if(!over)step(dt);
 if(mode==='host'&&rm&&t-lastSnap>100){lastSnap=t;snap()}
 draw();ui();requestAnimationFrame(loop)}
init();over=1;requestAnimationFrame(t=>{last=t;loop(t)});
</script></body></html>
